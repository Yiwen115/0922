<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園花朵生態調查回報</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-rose-50/50 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-rose-100 p-6 space-y-5">
    
    <!-- 標題區 -->
    <div>
      <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-pink-100 text-pink-700 mb-2">
        🌸 校園花朵觀察
      </div>
      <h1 class="text-xl font-bold text-slate-900">植物開花記錄表單</h1>
      <p class="text-xs text-slate-500 mt-1">定位與時間由系統自動抓取，填寫花況與拍照後即可送出。</p>
    </div>

    <!-- GPS 狀態提示列 -->
    <div class="p-3 bg-rose-50/40 border border-rose-100 rounded-2xl flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <span class="text-slate-500 font-medium">📍 定位狀態：</span>
        <span id="gpsStatusBadge" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-800">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
          正在定位中...
        </span>
      </div>
      <button type="button" id="reGpsBtn" class="text-pink-600 font-medium hover:underline">重新定位</button>
    </div>

    <!-- 表單 -->
    <form id="ecoForm" class="space-y-4">
      
      <!-- 隱藏 GPS 座標 (自動填入) -->
      <input type="hidden" id="gps">

      <!-- 1. 校園地點 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="location">校園植栽地點 <span class="text-rose-500">*</span></label>
        <input 
          type="text" 
          id="location" 
          required 
          placeholder="例如：文館前花圃、宮燈大道旁" 
          class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 transition"
        >
      </div>

      <!-- 2. 物種名稱 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="species">花朵／植物物種名稱 <span class="text-rose-500">*</span></label>
        <input 
          type="text" 
          id="species" 
          required 
          placeholder="例如：艷紫荊、杜鵑花、木棉花" 
          class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 transition"
        >
      </div>

      <!-- 3. 數量與單位 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="quantity">開花數量與狀態 <span class="text-rose-500">*</span></label>
        <input 
          type="text" 
          id="quantity" 
          required 
          placeholder="例如：約 20 朵、盛開滿樹、5 株" 
          class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 transition"
        >
      </div>

      <!-- 4. 照片選取（拍照或相簿檔案） -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">花朵照片 (拍照或相簿選取)</label>
        <div class="flex items-center gap-3">
          <label class="cursor-pointer px-4 py-2 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-xl text-xs font-medium text-pink-700 transition flex items-center gap-1.5 active:scale-95">
            📷 <span>拍攝或選擇照片</span>
            <input type="file" id="photoFile" accept="image/*" class="hidden">
          </label>
          <span id="fileNameDisplay" class="text-xs text-slate-400 truncate max-w-[180px]">未選取檔案</span>
        </div>

        <!-- 縮圖即時預覽 -->
        <div id="previewContainer" class="hidden mt-2.5 relative inline-block">
          <img id="imagePreview" src="" alt="花朵預覽" class="w-24 h-24 object-cover rounded-2xl border border-rose-200 shadow-sm">
          <button type="button" id="removePhotoBtn" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold shadow hover:bg-rose-600">×</button>
        </div>
      </div>

      <!-- 5. 備註描述 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="notes">花況備註描述</label>
        <textarea 
          id="notes" 
          rows="3" 
          placeholder="例如：紫紅色花瓣盛開，有淡淡香氣，樹下有些許落花..." 
          class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 transition"
        ></textarea>
      </div>

      <!-- 提交按鈕 -->
      <button 
        type="submit" 
        id="submitBtn" 
        class="w-full py-3 bg-pink-600 hover:bg-pink-700 active:bg-pink-800 text-white font-semibold text-sm rounded-xl transition shadow-md shadow-pink-200 flex items-center justify-center gap-2 cursor-pointer"
      >
        <span id="spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        <span id="btnText">提交花朵紀錄 (Submit)</span>
      </button>

      <!-- 結果訊息 -->
      <p id="resultMsg" class="text-xs text-center font-medium min-h-[1rem]"></p>
    </form>
  </div>

  <script>
    // 已直接填入您的 Apps Script 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzHheSBJVP2fbxTatezhDVgj4uYLiU_NPggZerKCJXE8un98SImLz6QMz7pDGv51/exec";

    const gpsInput = document.getElementById('gps');
    const gpsStatusBadge = document.getElementById('gpsStatusBadge');
    const reGpsBtn = document.getElementById('reGpsBtn');
    const ecoForm = document.getElementById('ecoForm');
    const photoFileInput = document.getElementById('photoFile');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const removePhotoBtn = document.getElementById('removePhotoBtn');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const resultMsg = document.getElementById('resultMsg');

    let selectedFileBase64 = "";
    let selectedFileName = "";
    let selectedFileMime = "";

    // 格式化送出時間 (YYYY-MM-DD HH:mm:ss)
    function getCurrentDateTime() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    // 自動啟動 GPS 定位
    function startGeolocation() {
      if (!navigator.geolocation) {
        gpsStatusBadge.className = 'inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-rose-100 text-rose-800';
        gpsStatusBadge.textContent = '裝置不支援定位';
        return;
      }

      gpsStatusBadge.className = 'inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-800';
      gpsStatusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>正在定位中...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          const acc = Math.round(pos.coords.accuracy);

          gpsInput.value = `${lat}, ${lng}`;
          gpsStatusBadge.className = 'inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-emerald-100 text-emerald-800';
          gpsStatusBadge.textContent = `定位成功 (±${acc}m)`;
        },
        (err) => {
          gpsStatusBadge.className = 'inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-rose-100 text-rose-800';
          gpsStatusBadge.textContent = '未取得定位權限';
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // 載入即自動定位
    window.addEventListener('DOMContentLoaded', startGeolocation);
    reGpsBtn.addEventListener('click', startGeolocation);

    // 處理照片選取與轉 base64
    photoFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      selectedFileName = file.name;
      selectedFileMime = file.type || "image/jpeg";
      fileNameDisplay.textContent = file.name;

      const reader = new FileReader();
      reader.onload = (event) => {
        const fullDataUrl = event.target.result;
        imagePreview.src = fullDataUrl;
        previewContainer.classList.remove('hidden');
        selectedFileBase64 = fullDataUrl.split(',')[1];
      };
      reader.readAsDataURL(file);
    });

    // 移除已選照片
    removePhotoBtn.addEventListener('click', () => {
      photoFileInput.value = "";
      selectedFileBase64 = "";
      selectedFileName = "";
      selectedFileMime = "";
      fileNameDisplay.textContent = "未選取檔案";
      previewContainer.classList.add('hidden');
      imagePreview.src = "";
    });

    // 送出表單瞬間抓取時間並發送 POST
    ecoForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitTime = getCurrentDateTime();

      const payload = {
        datetime: submitTime,
        location: document.getElementById('location').value.trim(),
        gps: gpsInput.value.trim(),
        species: document.getElementById('species').value.trim(),
        quantity: document.getElementById('quantity').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        fileBase64: selectedFileBase64,
        fileName: selectedFileName,
        fileMime: selectedFileMime
      };

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
      spinner.classList.remove('hidden');
      btnText.textContent = selectedFileBase64 ? '照片與資料上傳中...' : '資料送出中...';
      resultMsg.textContent = '';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: 'follow'
        });

        const res = await response.json();

        if (res.status === 'success') {
          resultMsg.className = 'text-xs text-center font-medium text-pink-600';
          resultMsg.textContent = `🌸 資料已於 ${submitTime} 成功記錄！`;

          // 清空部分欄位方便下一筆紀錄
          document.getElementById('species').value = '';
          document.getElementById('quantity').value = '';
          document.getElementById('notes').value = '';
          removePhotoBtn.click();
        } else {
          throw new Error(res.message || '伺服器端錯誤');
        }
      } catch (err) {
        resultMsg.className = 'text-xs text-center font-medium text-rose-600';
        resultMsg.textContent = `❌ 送出失敗：${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        spinner.classList.add('hidden');
        btnText.textContent = '提交花朵紀錄 (Submit)';
      }
    });
  </script>
</body>
</html>
