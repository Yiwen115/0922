<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生態調查紀錄回報</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6 space-y-5">
    
    <!-- 標題 -->
    <div>
      <h1 class="text-xl font-bold text-slate-800">🌿 生態觀察回報表單</h1>
      <p class="text-xs text-slate-500 mt-1">定位與時間由系統自動抓取，填妥內容後即可送出。</p>
    </div>

    <!-- GPS 定位狀態提示列 -->
    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <span class="text-slate-500 font-medium">📍 定位狀態：</span>
        <span id="gpsStatusBadge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-800">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
          正在定位中...
        </span>
      </div>
      <button type="button" id="reGpsBtn" class="text-emerald-600 hover:underline">重新定位</button>
    </div>

    <!-- 表單區 -->
    <form id="ecoForm" class="space-y-4">
      
      <!-- 隱藏 GPS 欄位 (自動帶入，使用者無需操作) -->
      <input type="hidden" id="gps">

      <!-- 1. 校園地點 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="location">校園地點 <span class="text-rose-500">*</span></label>
        <input 
          type="text" 
          id="location" 
          required 
          placeholder="例如：生態水池旁、文館前花圃" 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
        >
      </div>

      <!-- 2. 物種名稱 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="species">物種名稱 <span class="text-rose-500">*</span></label>
        <input 
          type="text" 
          id="species" 
          required 
          placeholder="例如：艷紫荊、白頭翁、大卷尾" 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
        >
      </div>

      <!-- 3. 數量與單位 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="quantity">數量與單位 <span class="text-rose-500">*</span></label>
        <input 
          type="text" 
          id="quantity" 
          required 
          placeholder="例如：3 隻、滿樹盛開、約 10 朵" 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
        >
      </div>

      <!-- 4. 照片縮圖網址 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="imageUrl">照片縮圖網址</label>
        <input 
          type="url" 
          id="imageUrl" 
          placeholder="https://...（若留空將自動使用原始圖）" 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition font-mono text-xs"
        >
      </div>

      <!-- 5. 照片原始連結 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="photoLink">照片原始連結</label>
        <input 
          type="url" 
          id="photoLink" 
          placeholder="例如 Google 雲端硬碟或原圖網址" 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition font-mono text-xs"
        >
      </div>

      <!-- 6. 備註描述 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1" for="notes">備註描述</label>
        <textarea 
          id="notes" 
          rows="3" 
          placeholder="記錄花況特徵、動物行為或天氣狀況..." 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
        ></textarea>
      </div>

      <!-- 提交按鈕 -->
      <button 
        type="submit" 
        id="submitBtn" 
        class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium text-sm rounded-xl transition shadow flex items-center justify-center gap-2 cursor-pointer"
      >
        <span id="spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        <span id="btnText">提交送出 (Submit)</span>
      </button>

      <!-- 送出狀態訊息提示 -->
      <p id="resultMsg" class="text-xs text-center font-medium min-h-[1rem]"></p>
    </form>
  </div>

  <script>
    // ⚠️ 請在此處填入您 Google Apps Script 發布的網頁應用程式網址 (結尾為 /exec)
    const GAS_URL = "您的_GOOGLE_APPS_SCRIPT_網頁應用程式網址_貼在這裡";

    const gpsInput = document.getElementById('gps');
    const gpsStatusBadge = document.getElementById('gpsStatusBadge');
    const reGpsBtn = document.getElementById('reGpsBtn');
    const ecoForm = document.getElementById('ecoForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const resultMsg = document.getElementById('resultMsg');

    // 格式化當前時間字串 (YYYY-MM-DD HH:mm:ss)
    function getCurrentDateTime() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    // 自動啟動 GPS 定位
    function startGeolocation() {
      if (!navigator.geolocation) {
        gpsStatusBadge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-rose-100 text-rose-800';
        gpsStatusBadge.textContent = '裝置不支援定位';
        return;
      }

      gpsStatusBadge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-800';
      gpsStatusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>正在定位中...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          const acc = Math.round(pos.coords.accuracy);

          gpsInput.value = `${lat}, ${lng}`;
          gpsStatusBadge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-100 text-emerald-800';
          gpsStatusBadge.textContent = `定位成功 (誤差 ±${acc}m)`;
        },
        (err) => {
          gpsStatusBadge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-rose-100 text-rose-800';
          gpsStatusBadge.textContent = '未取得定位權限或逾時';
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // 1. 網頁一載入，自動啟動定位
    window.addEventListener('DOMContentLoaded', startGeolocation);
    reGpsBtn.addEventListener('click', startGeolocation);

    // 2. 點擊「提交送出」事件
    ecoForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!GAS_URL || GAS_URL.includes("您的_GOOGLE_APPS_SCRIPT")) {
        alert("請先在代碼中填寫正確的 GAS_URL 網址！");
        return;
      }

      // 瞬間自動抓取當下精確時間
      const submitTime = getCurrentDateTime();

      // 打包 payload
      const payload = {
        datetime: submitTime,
        location: document.getElementById('location').value.trim(),
        gps: gpsInput.value.trim(),
        species: document.getElementById('species').value.trim(),
        quantity: document.getElementById('quantity').value.trim(),
        imageUrl: document.getElementById('imageUrl').value.trim(),
        photoLink: document.getElementById('photoLink').value.trim(),
        notes: document.getElementById('notes').value.trim()
      };

      // 按鈕載入狀態
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
      spinner.classList.remove('hidden');
      btnText.textContent = '資料送出中...';
      resultMsg.textContent = '';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避開預檢請求
          body: JSON.stringify(payload),
          redirect: 'follow' // 自動跟隨 Google 轉址
        });

        const res = await response.json();

        if (res.status === 'success') {
          resultMsg.className = 'text-xs text-center font-medium text-emerald-600';
          resultMsg.textContent = `✅ 資料於 ${submitTime} 成功寫入試算表！`;

          // 清空部分欄位，方便連續回報
          document.getElementById('species').value = '';
          document.getElementById('quantity').value = '';
          document.getElementById('imageUrl').value = '';
          document.getElementById('photoLink').value = '';
          document.getElementById('notes').value = '';
        } else {
          throw new Error(res.message || '伺服器發生錯誤');
        }
      } catch (err) {
        resultMsg.className = 'text-xs text-center font-medium text-rose-600';
        resultMsg.textContent = `❌ 傳送失敗：${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        spinner.classList.add('hidden');
        btnText.textContent = '提交送出 (Submit)';
      }
    });
  </script>
</body>
</html>
